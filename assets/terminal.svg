ace="preserve"><tspan fill="#d29922">  pause  </tspan><tspan fill="#c9d1d9">runaway loop · burn rate 3.1× baseline</tspan></text></g><g class="l11"><text x="22" y="300" xml:space="preserve"><tspan fill="#f85149">  block  </tspan><tspan fill="#c9d1d9">HTTP 402 {"retryable": false} · daily cap $10.00</tspan></text></g><g class="l12"><text x="22" y="322" xml:space="preserve"><tspan fill="#3fb950">~ ❯ </tspan><tspan fill="#bc8cff"># the model proposes. something deterministic decides.</tspan></text><rect class="m12" x="53.5" y="308.5" width="464" height="22" fill="#0d1117"/></g>
